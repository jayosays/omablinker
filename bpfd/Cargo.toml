[workspace]
resolver = "2"
members = [
    "omablinker-bpfd",
    "omablinker-bpfd-ebpf",
]
default-members = ["omablinker-bpfd"]

[workspace.package]
license = "MIT"
edition = "2021"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.19", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std"] }
env_logger = { version = "0.11", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
signal-hook = { version = "0.3", default-features = false }

# Keep debug info and disable inlining-across-codegen-units in the eBPF
# binary so `aya-log` messages and any future BTF-based debugging stay
# useful; this has no effect on the userspace binary's size or speed.
[profile.release.package.omablinker-bpfd-ebpf]
debug = 2
codegen-units = 1
strip = false
