[package]
name = "omablinker-bpfd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
signal-hook = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# See the comment in omablinker-bpfd-ebpf's build.rs / the aya-template this
# is based on: this ought to be an artifact-dependency, but cargo doesn't
# support that combined with `-Z build-std` yet, so build.rs cargo-in-cargos
# it. Depending on it here just gets us proper rebuild-on-change behavior.
omablinker-bpfd-ebpf = { path = "../omablinker-bpfd-ebpf" }

[[bin]]
name = "omablinker-bpfd"
path = "src/main.rs"
